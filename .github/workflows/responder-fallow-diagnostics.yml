name: Responder Fallow Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  fallow-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@9a46ab94fc51b6eed0fb663af2f201cc589b802d
        with:
          version: '2.91.0'
          command: audit
          gate: new-only
          fail-on-issues: false
          annotations: false
          artifacts-dir: .fallow-diagnostics
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: responder-fallow-output
          path: .fallow-diagnostics
          if-no-files-found: error
