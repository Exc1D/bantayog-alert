name: Apply Consent Rule Fix

on:
  push:
    branches:
      - fix/responder-enrollment-staging-bugs
    paths:
      - .github/workflows/apply-consent-rule-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/responder-enrollment-staging-bugs
      - name: Allow owners to refresh consent versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = """    match /user_consents/{consentUid} {
                allow read: if isAuthed() && uid() == consentUid;
                allow create: if isAuthed() && uid() == consentUid
                            && request.resource.data.keys().hasAll(['consentVersion', 'consentGivenAt', 'method'])
                            && request.resource.data.keys().hasOnly(['consentVersion', 'consentGivenAt', 'method'])
                            && request.resource.data.consentVersion is string
                            && request.resource.data.consentVersion.size() >= 1
                            && request.resource.data.consentGivenAt is timestamp
                            && request.resource.data.method is string
                            && request.resource.data.method in ['in_app_modal', 'web_form'];
                allow update: if false;
                allow delete: if false;
              }
          """
          new = """    match /user_consents/{consentUid} {
                allow read: if isAuthed() && uid() == consentUid;
                allow create, update: if isAuthed() && uid() == consentUid
                            && request.resource.data.keys().hasAll(['consentVersion', 'consentGivenAt', 'method'])
                            && request.resource.data.keys().hasOnly(['consentVersion', 'consentGivenAt', 'method'])
                            && request.resource.data.consentVersion is string
                            && request.resource.data.consentVersion.size() >= 1
                            && request.resource.data.consentGivenAt is timestamp
                            && request.resource.data.method is string
                            && request.resource.data.method in ['in_app_modal', 'web_form'];
                allow delete: if false;
              }
          """

          for filename in ('infra/firebase/firestore.rules.template', 'infra/firebase/firestore.rules'):
              path = Path(filename)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected consent rule block once in {filename}')
              path.write_text(text.replace(old, new))

          Path('.github/workflows/apply-consent-rule-fix.yml').unlink()
          PY
      - name: Commit rule update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/firebase/firestore.rules.template infra/firebase/firestore.rules .github/workflows/apply-consent-rule-fix.yml
          git commit -m "fix(rules): allow consent version updates"
          git push origin HEAD:fix/responder-enrollment-staging-bugs
