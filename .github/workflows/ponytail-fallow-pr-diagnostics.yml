name: Ponytail Fallow PR diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read

jobs:
  diagnostics:
    if: github.head_ref == 'fix/dashboard-truth-metrics'
    name: Ponytail Fallow diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: fallow-rs/fallow@9a46ab94fc51b6eed0fb663af2f201cc589b802d
        with:
          version: '2.91.0'
          command: audit
          gate: new-only
          fail-on-issues: false
          annotations: true

      - name: Save annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_id=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            | jq -r '.check_runs[] | select(.name == "Ponytail Fallow diagnostics") | .id' \
            | head -n 1)
          test -n "${check_id}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${check_id}/annotations" \
            > fallow-annotations.json
          cat fallow-annotations.json

      - uses: actions/upload-artifact@v4
        with:
          name: ponytail-fallow-annotations
          path: fallow-annotations.json
