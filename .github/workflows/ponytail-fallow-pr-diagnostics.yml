name: Ponytail Fallow PR diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.head_ref == 'fix/dashboard-truth-metrics'
    name: Ponytail Fallow diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: fallow-rs/fallow@9a46ab94fc51b6eed0fb663af2f201cc589b802d
        with:
          version: '2.91.0'
          command: audit
          gate: new-only
          fail-on-issues: false
          annotations: false

      - name: Save Fallow JSON
        if: always()
        run: |
          set +e
          fallow audit --format json --quiet --base origin/main --gate new-only > fallow-output.json
          rc=$?
          set -e
          echo "fallow exit code: ${rc}"
          cat fallow-output.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ponytail-fallow-output
          path: fallow-output.json
