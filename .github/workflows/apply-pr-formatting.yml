name: Apply PR Formatting

on:
  push:
    branches:
      - fix/responder-enrollment-staging-bugs
    paths:
      - .github/workflows/apply-pr-formatting.yml

permissions:
  contents: write

env:
  PNPM_VERSION: 9.12.0

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/responder-enrollment-staging-bugs
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Format changed source files
        run: |
          pnpm exec prettier --write \
            apps/responder-app/src/App.push-dismissal.test.tsx \
            apps/responder-app/src/App.tsx \
            apps/responder-app/src/components/PrivacyNoticeModal.test.tsx \
            apps/responder-app/src/components/PrivacyNoticeModal.tsx \
            apps/responder-app/src/pages/TotpEnrollmentPage.module.css \
            apps/responder-app/src/pages/TotpEnrollmentPage.test.tsx \
            apps/responder-app/src/pages/TotpEnrollmentPage.tsx \
            apps/responder-app/src/utils/qr-code.ts \
            functions/src/__tests__/rules/user-consents.rules.test.ts
          rm .github/workflows/apply-pr-formatting.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/responder-app/src/App.push-dismissal.test.tsx \
            apps/responder-app/src/App.tsx \
            apps/responder-app/src/components/PrivacyNoticeModal.test.tsx \
            apps/responder-app/src/components/PrivacyNoticeModal.tsx \
            apps/responder-app/src/pages/TotpEnrollmentPage.module.css \
            apps/responder-app/src/pages/TotpEnrollmentPage.test.tsx \
            apps/responder-app/src/pages/TotpEnrollmentPage.tsx \
            apps/responder-app/src/utils/qr-code.ts \
            functions/src/__tests__/rules/user-consents.rules.test.ts \
            .github/workflows/apply-pr-formatting.yml
          git commit -m "style: format responder staging fixes"
          git push origin HEAD:fix/responder-enrollment-staging-bugs
