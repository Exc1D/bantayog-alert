name: Ponytail Fallow Diagnostics

on:
  push:
    branches:
      - fix/dispatch-kpi-semantics

permissions:
  contents: read
  checks: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Fallow annotations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          check_id=''
          for _ in $(seq 1 60); do
            response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")
            check_id=$(jq -r '.check_runs[] | select(.name == "Fallow Audit (changed code)") | .id' <<<"${response}" | head -n 1)
            conclusion=$(jq -r '.check_runs[] | select(.name == "Fallow Audit (changed code)") | .conclusion' <<<"${response}" | head -n 1)
            if [[ -n "${check_id}" && "${conclusion}" != 'null' ]]; then
              break
            fi
            sleep 5
          done
          test -n "${check_id}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${check_id}/annotations" \
            | tee fallow-annotations.json

      - uses: actions/upload-artifact@v4
        with:
          name: fallow-diagnostics
          path: fallow-annotations.json
