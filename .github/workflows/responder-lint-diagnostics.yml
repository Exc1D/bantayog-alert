name: Responder Lint Diagnostics

on:
  push:
    branches:
      - fix/responder-enrollment-staging-bugs

permissions:
  contents: read

env:
  PNPM_VERSION: 9.12.0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Capture lint output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint > responder-lint.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lint output
        uses: actions/upload-artifact@v6
        with:
          name: responder-lint-output
          path: responder-lint.log
          if-no-files-found: error
      - name: Preserve lint result
        if: steps.lint.outputs.status != '0'
        run: exit 1
