name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  PNPM_VERSION: 9.12.0

jobs:
  setup:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile

  supply-chain:
    name: Supply Chain
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --audit-level high --prod

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-
      - run: pnpm lint
      - run: pnpm format:check

  fallow-audit:
    name: Fallow Audit (changed code)
    if: github.event_name == 'pull_request'
    needs: setup
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # audit diffs against the PR base ref
      # fallow-rs/fallow v2 branch snapshot from 2026-06-12.
      - uses: fallow-rs/fallow@976a868175368846efa5c43145b367ca9224c76d
        with:
          version: '2.91.0'
          command: audit
          gate: new-only
          fail-on-issues: true
          annotations: true

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm typecheck

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-
      - run: pnpm test

  functions-emulator-test:
    name: Functions Emulator Test
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Run functions tests with Firestore + RTDB + Storage emulators
        run: pnpm dlx firebase-tools emulators:exec --only firestore,database,storage 'cd functions && npx vitest run' --project demo-bantayog-alert

  rule-coverage:
    name: Rule Coverage Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-rule-coverage.ts
      - run: pnpm exec tsx scripts/build-rules.ts
      - name: Verify firestore.rules is not out of date
        run: |
          if ! git diff --exit-code -- infra/firebase/firestore.rules; then
            echo "::error::firestore.rules is out of sync with scripts/build-rules.ts. Run 'pnpm exec tsx scripts/build-rules.ts' locally and commit."
            exit 1
          fi

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm build
      - name: Verify emulator build guard rejects production builds
        run: |
          for app in citizen-pwa admin-desktop responder-app; do
            output=$(VITE_USE_EMULATOR=true pnpm --dir "apps/$app" exec vite build 2>&1) && rc=$? || rc=$?
            if [ $rc -eq 0 ]; then
              echo "::error::Build guard did not reject emulator-enabled production build in $app"
              echo "$output"
              exit 1
            elif ! echo "$output" | grep -q "Refusing production"; then
              echo "::error::Build failed in $app but not due to emulator guard"
              echo "$output"
              exit 1
            fi
            echo "✓ $app correctly rejected by guard"
          done

  e2e-full-loop:
    name: E2E Full-Loop Proof
    needs: [build, functions-emulator-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Run full-loop e2e proof against local emulator stack
        # proof-local.mjs prepares functions, starts emulators+dev servers,
        # seeds accounts, runs Playwright full-loop.spec.ts, then tears down.
        run: node scripts/proof-local.mjs
        env:
          BANTAYOG_FIREBASE_PROJECT_ID: demo-bantayog-alert
          CI: true

  rules-check:
    name: Firestore Rules Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate Firestore rules load
        run: pnpm dlx firebase-tools emulators:exec --only firestore 'exit 0' --project demo-bantayog-alert

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -recursive -check
      - run: terraform init -backend=false
      - run: terraform validate
